# Refuse package versions published less than 3 days ago (value is in
# minutes; yarn's default is 1440, i.e. 24h). Widens the window in which a
# compromised-maintainer publish can be caught and unpublished before it
# reaches this project.
npmMinimalAgeGate: 4320

